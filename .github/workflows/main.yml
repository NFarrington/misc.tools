name: Build and deploy

on:
  push:
  schedule:
    - cron: "0 8 * * 6" # 8AM Saturdays
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 17.x
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Build files
        run: node build.js
      - uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: build/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - environment: dev
            deploy-role-arn: AWS_DEPLOY_ROLE_ARN_DEV
            should_run: true
          - environment: prod
            deploy-role-arn: AWS_DEPLOY_ROLE_ARN_PROD
            should_run: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-site
          path: build/
        if: matrix.should_run
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars[matrix.deploy-role-arn] }}
          aws-region: us-east-1
        if: matrix.should_run
      - name: Deploy to ${{ matrix.environment }}
        run: aws s3 sync --sse AES256 --delete build/ s3://misc-tools-${{ matrix.environment }}-therailroad
        if: matrix.should_run
